<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="ink" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- 外枠（二重線風） -->
    <rect x="12" y="12" width="176" height="176" rx="6" ry="6" fill="none" stroke="#C41E1E" stroke-width="6"/>
    <rect x="20" y="20" width="160" height="160" rx="4" ry="4" fill="none" stroke="#C41E1E" stroke-width="2" opacity="0.5"/>
    <!-- 山 -->
    <text x="100" y="95" font-family="'Noto Serif JP', 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif" font-size="72" fill="#C41E1E" text-anchor="middle" font-weight="900" letter-spacing="0.05em">山</text>
    <!-- 上 -->
    <text x="100" y="170" font-family="'Noto Serif JP', 'Yu Mincho', 'MS Mincho', 'Hiragino Mincho ProN', serif" font-size="72" fill="#C41E1E" text-anchor="middle" font-weight="900" letter-spacing="0.05em">上</text>
  </g>
</svg>
